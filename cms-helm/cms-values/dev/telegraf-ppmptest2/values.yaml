deployment:
  enabled: true
  replicas: 0
  image:
    repository: image-registry.openshift-image-registry.svc:5000/ci-dcmlp-openshift/dcmlp-cm-telegraf
    tag: latest
  ports:
    - name: listener
      containerPort: 5687
  volumeMounts:
    - name: config-volume
      mountPath: /etc/telegraf/telegraf.conf
      subPath: telegraf.conf
      readOnly: true
  volumes:
    - name: config-volume
      configMap:
        name: dcmlp-cms-dev-telegraf-ppmptest2-config
  env:
    - name: INFLUX_TOKEN
      valueFrom:
        secretKeyRef:
          name: dcmlp-cms-dev-influxdb-secret
          key: INFLUXDB_TOKEN_ALL_BUCKETS_WRITE
  resources:
    limits:
      cpu: 20m
      memory: 150Mi
    requests:
      cpu: 10m
      memory: 50Mi

service:
  enabled: false

route:
  enabled: false

configmap:
  enabled: true
  name: dcmlp-cms-dev-telegraf-ppmptest2-config
  data:
    telegraf.conf: |
      [agent]
        interval = "5s"
      [[outputs.influxdb_v2]]
        urls = ["http://dcmlp-cms-dev-influxdb:8086"]
        token = "$INFLUX_TOKEN"
        organization = "dcmlp"
        bucket = "ppmptest2"
      [[inputs.http_listener_v2]]
        service_address = ":5687"
