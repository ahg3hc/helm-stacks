deployment:
  enabled: true
  replicas: 1
  image:
    repository: image-registry.openshift-image-registry.svc:5000/ci-dcmlp-openshift/dcmlp-cm-telegraf
    tag: latest
  ports:
    - name: http-listener
      containerPort: 5687
  volumeMounts:
    - name: config-volume
      mountPath: /etc/telegraf/telegraf.conf
      subPath: telegraf.conf
      readOnly: true
  volumes:
    - name: config-volume
      configMap:
        name: dcmlp-cms-qa-telegraf-ppmpmeaslq05-http-config
  env:
    - name: INFLUXDB_TOKEN_WRITE
      valueFrom:
        secretKeyRef:
          name: dcmlp-cms-qa-influxdb-secret
          key: INFLUXDB_TOKEN_ALL_BUCKETS_WRITE
    - name: HTTP_USER
      valueFrom:
        secretKeyRef:
          name: dcmlp-solace-q-secret
          key: HTTP_USER
    - name: HTTP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: dcmlp-solace-q-secret
          key: HTTP_PASSWORD
  resources:
    limits:
      cpu: 50m
      memory: 300Mi
    requests:
      cpu: 10m
      memory: 50Mi

service:
  enabled: true
  ports:
    - name: http-listener
      port: 5687
      targetPort: 5687

route:
  enabled: false

configmap:
  enabled: true
  name: dcmlp-cms-qa-telegraf-ppmpmeaslq05-http-config
  data:
    telegraf.conf: |
      ## Agent settings
      [agent]
          interval = "10s"
          round_interval = true
          metric_batch_size = 3000
          metric_buffer_limit = 50000
          collection_jitter = "0s"
          flush_interval = "5s"
          flush_jitter = "1s"
          precision = "100ms"
          omit_hostname = false
          skip_processors_after_aggregators = false
          debug = true

      [[inputs.http_listener_v2]]
        service_address = "tcp://:5687"
        paths = ["/telegraf_ppmp_measurement_v3_lq10"]
        path_tag = true
        methods = ["POST"]
        http_success_code = 204
        read_timeout = "10s"
        write_timeout = "10s"
        data_source = "body"
        basic_username = "${HTTP_USER}"
        basic_password = "${HTTP_PASSWORD}"
        data_format = "value"
        data_type = "string"

      [[processors.starlark]]
          script = "/etc/telegraf/star/PPMPMeasurementV3_lq05_http_v3.0.star"

      [[outputs.influxdb_v2]]
          urls = ["http://cms-qa-influxdb:8086"]
          token = "${INFLUXDB_TOKEN_WRITE}"
          organization = "DC"
          bucket = "DCMLP_CMS_DB_HorP"
          timeout = "30s"
          insecure_skip_verify = true
          [outputs.influxdb_v2.tagpass]
            device_additionalData_plant = ["HorP"]

      [[outputs.influxdb_v2]]
          urls = ["http://cms-qa-influxdb:8086"]
          token = "${INFLUXDB_TOKEN_WRITE}"
          organization = "DC"
          bucket = "DCMLP_CMS_DB_EcP"
          timeout = "30s"
          insecure_skip_verify = true
          [outputs.influxdb_v2.tagpass]
            device_additionalData_plant = ["EcP"]

      [[outputs.influxdb_v2]]
          urls = ["http://cms-qa-influxdb:8086"]
          token = "${INFLUXDB_TOKEN_WRITE}"
          organization = "DC"
          bucket = "DCMLP_CMS_DB_BuP2"
          timeout = "30s"
          insecure_skip_verify = true
          [outputs.influxdb_v2.tagpass]
            device_additionalData_plant = ["BuP2"]

      [[outputs.influxdb_v2]]
          urls = ["http://cms-qa-influxdb:8086"]
          token = "${INFLUXDB_TOKEN_WRITE}"
          organization = "DC"
          bucket = "DCMLP_CMS_DB_PkP"
          timeout = "30s"
          insecure_skip_verify = true
          [outputs.influxdb_v2.tagpass]
            device_additionalData_plant = ["PkP"]

      [[outputs.influxdb_v2]]
          urls = ["http://cms-qa-influxdb:8086"]
          token = "${INFLUXDB_TOKEN_WRITE}"
          organization = "DC"
          bucket = "DCMLP_CMS_DB_QueP1"
          timeout = "30s"
          insecure_skip_verify = true
          [outputs.influxdb_v2.tagpass]
            device_additionalData_plant = ["QueP1"]

      [[outputs.influxdb_v2]]
          urls = ["http://cms-qa-influxdb:8086"]
          token = "${INFLUXDB_TOKEN_WRITE}"
          organization = "DC"
          bucket = "DCMLP_CMS_DB_HoP2"
          timeout = "30s"
          insecure_skip_verify = true
          [outputs.influxdb_v2.tagpass]
            device_additionalData_plant = ["HoP2"]

      [[outputs.influxdb_v2]]
          urls = ["http://cms-qa-influxdb:8086"]
          token = "${INFLUXDB_TOKEN_WRITE}"
          organization = "DC"
          bucket = "DCMLP_CMS_DB_FniP"
          timeout = "30s"
          insecure_skip_verify = true
          [outputs.influxdb_v2.tagpass]
            device_additionalData_plant = ["FniP"]

      [[outputs.influxdb_v2]]
          urls = ["http://cms-qa-influxdb:8086"]
          token = "${INFLUXDB_TOKEN_WRITE}"
          organization = "DC"
          bucket = "DCMLP_CMS_DB_MH"
          timeout = "30s"
          insecure_skip_verify = true
          [outputs.influxdb_v2.tagpass]
            device_id = [
              "405497281000000000171240",
              "405497281000000000177134",
              "405497281000000000188572",
              "405497281000000000216031",
              "405497281000000000354941",
              "405497281000000000328072"
              ]
