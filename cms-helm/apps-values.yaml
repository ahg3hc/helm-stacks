cluster:
  project: cms

apps:
  # ═══════════════════════════════════════════════════════════════════════════
  # CMS DEV
  # Deploy order: databases > reverse-proxy > collectors > cronjobs
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Layer 1: Databases (deploy first, everything else depends on these) ──
  cms-dev-influxdb:
    enabled: true
    repoURL: https://github.com/ahg3hc/helm-stacks.git
    targetRevision: dev
    chartPath: cms-helm
    valuePath: cms-values/dev/influxdb
    namespace: ci-dcmlp-openshift-cms-dev

  # ── Layer 2: Reverse proxy ──
  cms-dev-nginx:
    enabled: true
    repoURL: https://github.com/ahg3hc/helm-stacks.git
    targetRevision: dev
    chartPath: cms-helm
    valuePath: cms-values/dev/nginx
    namespace: ci-dcmlp-openshift-cms-dev

  # ── Layer 3: UI ──
  cms-dev-grafana:
    enabled: true
    repoURL: https://github.com/ahg3hc/helm-stacks.git
    targetRevision: dev
    chartPath: cms-helm
    valuePath: cms-values/dev/grafana
    namespace: ci-dcmlp-openshift-cms-dev

