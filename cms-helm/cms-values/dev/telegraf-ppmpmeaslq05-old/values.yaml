deployment:
  enabled: true
  replicas: 1
  image:
    repository: image-registry.openshift-image-registry.svc:5000/ci-dcmlp-openshift/dcmlp-cm-telegraf
    tag: latest
  ports:
    - name: listener
      containerPort: 8080
  volumeMounts:
    - name: config-volume
      mountPath: /etc/telegraf/telegraf.conf
      subPath: telegraf.conf
      readOnly: true
  volumes:
    - name: config-volume
      configMap:
        name: dcmlp-cms-dev-telegraf-ppmpmeaslq05-old-config
  env:
    - name: INFLUXDB_TOKEN_WRITE
      valueFrom:
        secretKeyRef:
          name: dcmlp-cms-dev-influxdb-secret
          key: INFLUXDB_TOKEN_ALL_BUCKETS_WRITE
    - name: MQTT_USER
      valueFrom:
        secretKeyRef:
          name: dcmlp-solace-q-secret
          key: MQTT_USER
    - name: MQTT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: dcmlp-solace-q-secret
          key: MQTT_PASSWORD
  initContainers:
    - name: check-mqtt-connectivity
      image: busybox
      command:
        - sh
        - -c
        - |
          echo "Checking connectivity to MQTT broker..."
          PASS=0
          for HOST in 10.82.207.7 10.82.207.6; do
            if nc -zv -w 5 $HOST 10320 2>&1; then
              echo "$HOST:10320 reachable!"
              PASS=$((PASS+1))
            else
              echo "ERROR: $HOST:10320 NOT reachable"
            fi
          done
          if [ $PASS -eq 0 ]; then
            echo "FAILED: Neither IP is reachable on port 10320"
            exit 1
          fi
          echo "At least one MQTT broker IP reachable."
          exit 0
  resources:
    limits:
      cpu: 20m
      memory: 150Mi
    requests:
      cpu: 5m
      memory: 50Mi

service:
  enabled: false

route:
  enabled: false

configmap:
  enabled: true
  name: dcmlp-cms-dev-telegraf-ppmpmeaslq05-old-config
  data:
    telegraf.conf: |
      [agent]
          interval = "5s"
          round_interval = true
          metric_batch_size = 2000
          metric_buffer_limit = 20000
          collection_jitter = "0s"
          flush_interval = "5s"
          flush_jitter = "0s"
          omit_hostname = false
          skip_processors_after_aggregators = false
          debug = true

      [[inputs.mqtt_consumer]]
          servers = ["mqtts://si0vm02988.de.bosch.com:10320"]
          topics = [
            "PPMP/Measurement/V2/HorP/#",
            "PPMP/Measurement/V2/HoP2/#"
            ]
          username = "${MQTT_USER}"
          password = "${MQTT_PASSWORD}"
          tls_ca = "/etc/telegraf/certs/Bosch-MQTT.pem"
          insecure_skip_verify = true
          data_format = "value"
          data_type = "string"
          [inputs.mqtt_consumer.tagpass]
            topic = [
              "PPMP/Measurement/V2/HoP2/lq10/405497280000000002001631",
              "PPMP/Measurement/V2/HoP2/lq10/405497280000000000362072",
              "PPMP/Measurement/V2/HoP2/lq10/405497280000000000361909",
              "PPMP/Measurement/V2/HoP2/lq10/405497280000000000361578",
              "PPMP/Measurement/V2/HoP2/lq10/405497280000000000361943",
              "PPMP/Measurement/V2/HoP2/lq10/405497280000000000361934",
              "PPMP/Measurement/V2/HoP2/lq10/405497280000000000361962",
              "PPMP/Measurement/V2/HoP2/lq10/405497280000000000362120",
              "PPMP/Measurement/V2/HoP2/lq10/405497280000000000362059",
              "PPMP/Measurement/V2/HoP2/lq10/405497280000000000361522",
              "PPMP/Measurement/V2/HoP2/lq10/405497280000000000361566",
              "PPMP/Measurement/V2/HoP2/lq10/405497280000000000361495"
            ]

      [[processors.starlark]]
          script = "/etc/telegraf/star/PPMPMeasurementV2_lq05_mqtt_v1.0.star"

      [[outputs.influxdb_v2]]
          urls = ["http://dcmlp-cms-dev-influxdb:8086"]
          token = "${INFLUXDB_TOKEN_WRITE}"
          organization = "DC"
          bucket = "DCMLP_CMS_DB_HoP2_OLD"
          timeout = "60s"
          insecure_skip_verify = true
